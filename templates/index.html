
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login | Login Attempt Limiter</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #142c50, #07111f 60%, #030811);
            color: white;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            background: rgba(16, 32, 55, 0.85);
            border: 1px solid rgba(64, 155, 255, 0.25);
            border-radius: 20px;
            box-shadow: 0 0 45px rgba(0, 132, 255, 0.12);
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            background: #102e50;
            border: 1px solid #278cff;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(39, 140, 255, 0.3);
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #9aafc9;
            font-size: 14px;
            margin-bottom: 32px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 14px;
            color: #d5e5fa;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 22px;
            background: #09182b;
            border: 1px solid #294362;
            border-radius: 9px;
            color: white;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #2994ff;
            box-shadow: 0 0 10px rgba(41, 148, 255, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(90deg, #0878e8, #21a4ff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(33, 164, 255, 0.3);
        }

        .security {
            margin-top: 25px;
            padding: 13px;
            text-align: center;
            background: rgba(30, 120, 220, 0.1);
            border-radius: 9px;
            color: #9ecbfa;
            font-size: 12px;
        }

        .footer {
            text-align: center;
            color: #7188a4;
            font-size: 12px;
            margin-top: 22px;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            background: #d1fae5;
            color: #065f46;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        #countdown {
            display: block;
            margin-top: 10px;
            font-size: 28px;
            color: #991b1b;
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="logo">🛡️</div>

        <h1>Secure Login</h1>

        <p class="subtitle">
            Login Attempt Limiter System
        </p>

        <form action="/login" method="POST">

            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   placeholder="Enter your username"
                   autocomplete="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter your password"
                   autocomplete="current-password" required>

            <button type="submit">Sign In →</button>

        </form>

        {% if message %}
        <div class="message {{ status }}">
            {{ message }}

            {% if remaining_seconds is defined and remaining_seconds > 0 %}
                <span id="countdown"
                      data-seconds="{{ remaining_seconds }}">
                    {{ remaining_seconds }}
                </span>
            {% endif %}
        </div>
        {% endif %}

        <div class="security">
            🔒 Protected by Login Attempt Limiter
        </div>

        <p class="footer">
            Cybersecurity Mini Project | 2026
        </p>

    </div>

    <script>
        
const timer = document.getElementById("countdown");

if (timer) {
    let seconds = Number(timer.dataset.seconds);

    const interval = setInterval(function () {
        seconds--;

        if (seconds <= 0) {
            clearInterval(interval);
            timer.textContent = "0";

            // Enable login again without reloading
            const button = document.querySelector(
                'button[type="submit"]'
            );

            if (button) {
                button.disabled = false;
                button.textContent = "Sign In →";
            }

            const inputs = document.querySelectorAll(
                'input[name="username"], input[name="password"]'
            );

            inputs.forEach(input => input.disabled = false);

            timer.textContent = "You can try logging in again!";
            timer.style.fontSize = "15px";
        } else {
            timer.textContent = seconds;
        }
    }, 1000);
}

    </script>

</body>
</html>
